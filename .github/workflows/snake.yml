name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # update otomatis setiap hari
  workflow_dispatch:       # bisa dijalankan manual dari tab Actions
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake (Binance palette)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-binance.svg?color_snake=#FCD535&color_dots=#2b3139,#3a3a1f,#7a6a10,#c9a40e,#FCD535

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
