name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # update otomatis setiap hari
  workflow_dispatch:       # bisa dijalankan manual dari tab Actions
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake (Apple palette, light + dark)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-apple.svg?color_snake=#0066cc&color_dots=#f5f5f7,#cce0f5,#80b3e6,#3385d6,#0066cc
            dist/snake-apple-dark.svg?color_snake=#2997ff&color_dots=#2a2a2c,#123a5e,#1a5c99,#1f7ad1,#2997ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
